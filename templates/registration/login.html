{% extends 'ratemypet/registration_base.html' %}

{% block title_block %}
    Login
{% endblock %}
 
{% block header_block %}
    <h1> RateMyPet </h1>
{% endblock %}

{% block body_block %}
    <form method="post" action=".">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="submit" value="Log In" />
        <input type="hidden" name="next" value="{{ next }}" />
    </form>

    <p>
        Not registered?
        <a href="{% url 'registration_register' %}">Register here!</a>
    </p>
    {% endblock %}
