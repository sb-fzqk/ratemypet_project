{% extends 'ratemypet/base.html' %}
{% load staticfiles %}

{% block title_block %}
    Settings
{% endblock %}

{% block body_block %}
    <div class="layout">
    <h1> Settings</h1>

    <div class="change">
        <form method="POST">
            {% csrf_token %}
            <label>New Password:</label>
            <input type="password" name="new_password">
            <button type="submit" class="upload-btn" onclick="return confirm('Are you sure you want to change your password?')">Change Password</button>
        </form>
    </div>

    <!-- need to check if the logout button works -->
    <div class="logout">
        Do you want to logout? 

        <form method="post" action="{% url 'auth_logout' %}">
            {% csrf_token %}
            <button type="submit" class="upload-btn">Logout</button>
        </form>
    </div>

    <div class="delete">
        Do you want to delete your account?
        <form method="post" action="{% url 'ratemypet:delete_account' %}">
            {% csrf_token %}
            <button type="submit" class="upload-btn" onclick="return confirm('Are you sure you want to delete your account? This cannot be undone.')">Delete</button>
        </form>
    </div>
    </div>

{% endblock %}
