<!DOCTYPE html>
{% load staticfiles %}

<html>
    <head>
        <title>
            RateMyPet -
            {% block title_block %}
            {% endblock %}
        </title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>

    <body>
        {% if user.is_authenticated %}
            <div class="container">
                <div class="sidebar">
                    <h2 class="logo">
                        <i class="fa-solid fa-paw" style="color: #9FC5F8;"><span> RateMyPet</span></i>
                    </h2>

                    <a class="menu-item" href="{% url 'ratemypet:home' %}">
                        <i class="fa-solid fa-house"></i> <span>Home</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:post' %}">
                        <i class="fa-solid fa-add"></i> <span>Post</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:messages' %}">
                        <i class="fa-solid fa-comment-dots"></i> <span>Messages</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:notifications' %}">
                        <i class="fa-solid fa-bell"></i> <span>Notifications</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:search' %}">
                        <i class="fa-solid fa-magnifying-glass"></i> <span>Search</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:profile' %}">
                        <i class="fa-solid fa-user"></i> <span>Profile</span>
                    </a>
                    <a class="menu-item" href="{% url 'ratemypet:settings' %}">
                        <i class="fa-solid fa-gear"></i> <span>Settings</span>
                    </a>
                </div>

                <div class="content">
                    {% block body_block %}
                    {% endblock %}
                    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
                    <script src ="{% static 'js/chat.js'%}"></script>
                </div>
            </div>
        {% else %}
            <div class="auth-links">
                <a href="{% url 'registration_register' %}">Sign Up</a>
                <a href="{% url 'login' %}">Login</a>
            </div>
        {% endif %}

        <script>
            document.querySelectorAll('.like-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();

                    const postId = this.dataset.postId;
                    const heart = document.getElementById(`like-heart-${postId}`)
                    const count = document.getElementById(`like-count-${postId}`)

                    fetch(`/add-like/${postId}/`, {
                        method: 'POST',
                        headers: {'X-CSRFToken': '{{ csrf_token }}',}
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.liked) {
                            heart.classList.replace('far', 'fas');
                        } else {
                            heart.classList.replace('fas', 'far');
                        }
                        count.innerText = data.count;
                    });
                });
            });

            document.querySelectorAll('.add-friend-button').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const button = e.currentTarget;
                    const url = button.dataset.url;

                    fetch(url, {
                        method: 'POST',
                        headers: {"X-CSRFToken": '{{ csrf_token }}',}
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'sent') {
                            const userId = button.dataset.userId;
                            const allButtonsForUser = document.querySelectorAll(`.add-friend-button[data-user-id="${userId}"]`);
                            
                            allButtonsForUser.forEach(item => {
                                item.style.display = 'none';
                            });
                        }
                    })
                    .catch(error => console.error('Error:', error));
                });
            });
        </script>
    </body>

</html>
