{% extends 'ratemypet/base.html' %}
{% load staticfiles %}

{% block title_block %}
    Search Users
{% endblock %}

{% block body_block %}
    <div class="feed">
        <!-- do we want users to be the username of the chosen user?? -->
    <h1> Users</h1>

    {#  for post in posts -> loop through all the posts of the chosen user#}
    <div class="post">

        <div class="post-header">
            <div class="user-info">
                <i class="fa-regular fa-user"></i>
                <!-- instead of span, {get the username}  -->
                <span>user1</span>  
            </div>
            <!-- add an if statement - button to make people be friends with each other -->
            <span class="friends">Friends</span>
        </div>


        <div class="post-image">
            <!-- put the post.image instead of hard coding it  -->
            <img src="{% static 'images/rabbit.jpg' %}" alt="Rabbit">
        </div>

        <div class="post-actions">
            <!-- make heart a button connent it to the database  -->
            <i class="fa-regular fa-heart"></i>
            <!-- make comment a button to see all the other comments -->
            <i class="fa-regular fa-comment"></i>
            <!-- get the pet category -->
            <span class="pet-type">Rabbit</span>
        </div>


        <div class="post-caption">
            <!-- get he post caption -->
            Running Rabbit
        </div>


        <div class="post-comment">
            <!-- get the most recent comment  -->
            <b>user2:</b> OMG LOVE
        </div>

    </div>


    </div>
{% endblock %}
